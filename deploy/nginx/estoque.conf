# Medic-stock (MSS) — nginx site
#
#   sudo cp deploy/nginx/estoque.conf /etc/nginx/sites-available/estoque
#   sudo nano /etc/nginx/sites-available/estoque        # trocar o domínio
#   sudo ln -s /etc/nginx/sites-available/estoque /etc/nginx/sites-enabled/estoque
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d estoque.seudominio.com.br
#
# There is a single server block, on port 80, on purpose. `certbot --nginx` edits
# this very block — it adds the certificate, turns it into a 443 listener and
# creates a separate block redirecting http to https. Everything below is carried
# over automatically.
#
# Writing the 443 block by hand beforehand does not work: nginx refuses to start
# with an ssl listener and no certificate, and certbot never gets to run.

server {
    listen 80;
    # Uncomment only if the VPS has IPv6. On a machine without it, nginx refuses to
    # start with "Address family not supported by protocol" and the site stays down.
    # `ip -6 addr` tells you.
    # listen [::]:80;

    # Replace with the real domain BEFORE running certbot. Let's Encrypt does not
    # issue certificates for a bare IP, and without https the browser blocks the
    # camera — which would leave the code reader unusable.
    server_name estoque.seudominio.com.br;

    root /var/www/estoque;
    index index.html;

    # The consumption sheet goes up to 15MB per file and 40MB per request
    # (spring.servlet.multipart in the mss). nginx defaults to 1MB and would
    # answer 413 before the request ever reached the application.
    client_max_body_size 40M;

    # A spreadsheet import of more than a thousand items takes a while on the
    # server; 60s (the default) would cut the connection mid-import.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API ----------------------------------------------------------------
    # The trailing slash in proxy_pass is what strips the /api prefix, exactly
    # like the Vite proxy does in development (rewrite ^/api -> ''). Without it
    # every call answers 404.
    location /api/ {
        proxy_pass http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # streams the upload instead of buffering 40MB first
    }

    # To route the API through the gateway instead of straight to the mss, comment
    # out the block above and use this one. It is not the default: the direct route
    # is the same one development uses, and the gateway depends on Eureka keeping
    # the mss registration alive — if that drops, the whole system answers 503.
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8090/mss/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ---- Swagger ------------------------------------------------------------
    # Turned off. The documentation is disabled in the application
    # (springdoc.*.enabled=false), and nginx does not route to it either — the two
    # locks are independent on purpose, so forgetting one does not publish the map
    # of the API by accident.
    #
    # To inspect it for a while: set SWAGGER_ENABLED=true in the .env, restart the
    # mss, uncomment the block below with your own address, and reload nginx. It
    # then asks for an administrator session. Put both back afterwards.
    #
    # location ~ ^/(swagger-ui|v3/api-docs) {
    #     allow 189.0.0.0/8;   # your address here
    #     deny all;
    #     proxy_pass http://127.0.0.1:8085;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ---- Frontend -----------------------------------------------------------
    # The code reader loads a .wasm, and the browser refuses to compile it when it
    # arrives under the wrong type. `default_type` in a location only affects this
    # location; a `types { }` block here would REPLACE the whole inherited table
    # and break the type of every other file on the site.
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite puts a hash in the name of every asset, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is what points to the new assets after a
    # deploy. Cached, the browser keeps loading the previous version.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router: any unknown path is answered with index.html, so opening
    # https://<domain>/estoque directly works instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Ubuntu 22.04 ships nginx 1.18, where everything above is valid as written —
# including `listen 443 ssl http2;`, which certbot writes.
#
# Only if you ever move to nginx 1.25.1 or newer: that form starts logging a
# deprecation warning, and the current spelling is `listen 443 ssl;` plus
# `http2 on;` in the same block. `nginx -v` tells the version.
#
# The .wasm location above matters more on 1.18 than on newer versions: its
# mime.types has no entry for wasm at all, so without that block the code reader's
# WebAssembly would arrive as application/octet-stream and the browser would refuse
# to compile it. Tested both ways.
