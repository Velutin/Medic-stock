spring.application.name=mss
server.port=8085

# Behind nginx: honour X-Forwarded-Proto/For so the application sees https and the real client IP.
server.forward-headers-strategy=FRAMEWORK

# Datasource (PostgreSQL). In production, set the environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5440/mssdb}
spring.datasource.username=${DB_USER:mss}
spring.datasource.password=${DB_PASSWORD:msspass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool. The default (10) is kept; lower it only if PostgreSQL runs with little memory.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA / Hibernate - the schema is managed exclusively by Flyway
# After the first successful start, switch to "validate" to check entities against tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bahia
spring.jackson.time-zone=America/Bahia

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}

# Uploads (consumption sheet photos/PDF and spreadsheets)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB

# File storage and reports
app.storage.dir=${STORAGE_DIR:./storage}
# Report header: replace branding/logo.png to change the logo (no code change or rebuild needed).
# Without the file, the company name is printed instead.
app.report.logo-path=${LOGO_PATH:./branding/logo.png}
app.report.company-name=${COMPANY_NAME:Baumer}
app.frontend-url=${FRONTEND_URL:https://localhost:5173}

# Session cookie. MUST be true in production (https): without it the browser sends
# the session cookie over plain http as well.
app.security.cookie-secure=${COOKIE_SECURE:false}

# Brake on repeated sign-in attempts (LoginThrottleService).
# Per account: this many wrong passwords are free, then the wait grows 2s, 4s, 8s... up to the cap.
# The account is never locked, so nobody can leave a colleague outside the system on purpose.
app.security.login.account-free-attempts=${LOGIN_FREE_ATTEMPTS:3}
app.security.login.account-max-delay-seconds=${LOGIN_MAX_DELAY_SECONDS:30}
# Per address: ceiling of failures per window. This is what bounds the processor cost of BCrypt.
# Raise it if the hospital has many users behind a single public address and they trip it.
app.security.login.ip-max-failures=${LOGIN_IP_MAX_FAILURES:30}
app.security.login.ip-window-seconds=${LOGIN_IP_WINDOW_SECONDS:300}

# JWT - in production, JWT_SECRET is required and must be long and random
api.security.token.secret=${JWT_SECRET:troque-este-segredo-em-producao}

# Swagger/OpenAPI — OFF in production.
# The documentation publishes the whole map of the API: every route, every field, every rule.
# It is a gift to whoever is looking for a way in, and the system does not need it to run.
#
# Turned off here, /v3/api-docs and /swagger-ui answer 404 to everybody. To bring it back for a
# while (to inspect an endpoint, say), set SWAGGER_ENABLED=true in the .env and restart the mss:
#   docker compose ... up -d mss
# It then comes back restricted to ADMIN/MASTER, through the browser session — never public again,
# because the exception that made those paths public was removed from SecurityConfig.
# Remember to put it back to false afterwards.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
broker.exchange.email.name=email.exchange
broker.queue.email.name=default.email

# Eureka client config
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8082/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Disable Spring Cloud compatibility verification
spring.cloud.compatibility-verifier.enabled=false

# API messages (including validation) are always in English; the frontend translates them
spring.web.locale=en
spring.web.locale-resolver=fixed
