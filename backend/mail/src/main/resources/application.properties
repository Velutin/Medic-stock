spring.config.import=optional:file:.env[.properties]

spring.application.name=mail
server.port=8081

# Datasource (Postgres - Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/mssemaildb}
spring.datasource.username=${DB_USER:email}
spring.datasource.password=${DB_PASSWORD:msemailpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool. This service only writes the delivery log, so a small pool is enough.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate
# Use Flyway for schema migrations; do not let Hibernate auto-create the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging. In production keep INFO: at DEBUG/TRACE the body of every e-mail
# (including the first-access and password-reset links) is written to disk.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOG_LEVEL:INFO}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
broker.queue.email.name=default.email

# Mail properties. There is no default on purpose: without a real SMTP the service
# does not start, which is the visible signal. Were it to start without one, the
# first-access invitations would be consumed from the queue and lost silently.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka client config
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8082/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Disable Spring Cloud compatibility verification
spring.cloud.compatibility-verifier.enabled=false
