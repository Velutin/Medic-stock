spring.config.import=optional:file:.env[.properties]

spring.application.name=mail
server.port=8081

# Datasource (Postgres - Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/mssemaildb}
spring.datasource.username=${DB_USER:email}
spring.datasource.password=${DB_PASSWORD:msemailpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool. This service only writes the delivery log, so a small pool is enough.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate
# Use Flyway for schema migrations; do not let Hibernate auto-create the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging. In production keep INFO: at DEBUG/TRACE the body of every e-mail
# (including the first-access and password-reset links) is written to disk.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_BIND_LOG_LEVEL:INFO}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
broker.queue.email.name=default.email
# Invoice mailbox: messages read here and published for the mss, and the requests that ask for a reading.
# Both queues are declared by this service and by the mss, so neither side being down loses a message.
broker.queue.invoice.name=${INVOICE_QUEUE:invoice.inbound}
broker.queue.invoice.read.name=${INVOICE_READ_QUEUE:invoice.read.request}

# Invoice mailbox (IMAP). A dedicated account, separate from the sending one above: this one is opened by a
# robot that marks messages as read, the other is the address users reply to.
# On Gmail it takes two-step verification plus an app password - never the account password.
# Turned off until the credentials are in the .env, so the service starts either way.
invoice.mailbox.enabled=${INVOICE_MAILBOX_ENABLED:false}
invoice.mailbox.host=${INVOICE_MAILBOX_HOST:imap.gmail.com}
invoice.mailbox.port=${INVOICE_MAILBOX_PORT:993}
invoice.mailbox.username=${INVOICE_MAILBOX_USERNAME:}
invoice.mailbox.password=${INVOICE_MAILBOX_PASSWORD:}
invoice.mailbox.folder=${INVOICE_MAILBOX_FOLDER:INBOX}
# Folder the read messages are copied to; empty leaves them in place, only marked as read. Nothing is deleted.
invoice.mailbox.processed-folder=${INVOICE_MAILBOX_PROCESSED_FOLDER:}

# Mail properties. There is no default on purpose: without a real SMTP the service
# does not start, which is the visible signal. Were it to start without one, the
# first-access invitations would be consumed from the queue and lost silently.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Eureka client config
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8082/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Disable Spring Cloud compatibility verification
spring.cloud.compatibility-verifier.enabled=false
