# Server configuration
spring.application.name=eureka-server
server.port=8082

# Eureka Server configuration
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8082/eureka/}

# Self-preservation: false is a development setting. In production set
# EUREKA_SELF_PRESERVATION=true, so a momentary network glitch does not make Eureka
# evict services that are alive.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_MS:3000}

# Logging
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
