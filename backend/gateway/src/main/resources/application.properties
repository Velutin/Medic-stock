spring.application.name=api-gateway
server.port=8090

# Disable compatibility verification
spring.cloud.compatibility-verifier.enabled=false

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8082/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# Gateway Discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Upload size. Only matters if /api is ever routed through the gateway: WebFlux buffers
# the body in memory and the default (256KB) would reject the consumption sheet.
spring.codec.max-in-memory-size=${MAX_IN_MEMORY_SIZE:20MB}

# CORS. Not used while nginx serves the frontend and the API on the same origin;
# it only matters if the frontend is ever served from another domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging. DEBUG on the gateway writes one block per request and fills the disk.
logging.level.org.springframework.cloud.gateway=${GATEWAY_LOG_LEVEL:INFO}
